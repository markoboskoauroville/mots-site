# Active once this folder is the ROOT of its own GitHub repository (see README).
name: Refresh program and deploy
on:
  schedule: [{ cron: '17 4 * * *' }]   # daily, 04:17 UTC
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/refresh.py
      - name: Commit refreshed data
        run: |
          git config user.name "mots-bot"; git config user.email "mots-bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Refresh program data" && git push) || true
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deploy
        uses: actions/deploy-pages@v4
